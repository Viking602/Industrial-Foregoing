plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = minecraft_version + '-' + mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
repositories { maven { url = 'https://maven.terraformersmc.com/' } }
sourceSets.main.resources { srcDir 'src/generated/resources'; exclude '**/.cache/**' }
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('../../mods/titanium-26.1.2-4.0.12.jar')
    implementation files('../../mods/jei-26.1.2-neoforge-29.47.0.111.jar')
    implementation files('../../mods/Jade-mc26.1-NeoForge-26.1.12.jar')
    implementation files('../../mods/patchouli-neoforge-26.1-94.jar')
    implementation files('../../mods/curios-neoforge-15.0.0+26.1.2.jar')
    implementation files('../../mods/ftb-chunks-neoforge-26.1.2.8.jar')
    implementation files('../../mods/ftb-library-neoforge-26.1.2.9.jar')
    implementation files('../../mods/ftb-teams-neoforge-26.1.2.4.jar')

}
tasks.withType(ProcessResources).configureEach {
    def props = [minecraft_version:minecraft_version, minecraft_version_range:minecraft_version_range,
        neo_version:neo_version, neo_version_range:neo_version_range, loader_version_range:loader_version_range,
        mod_id:mod_id, mod_name:mod_name, mod_license:mod_license, mod_version:project.version,
        mod_authors:mod_authors, mod_description:mod_description]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '3000']
}
tasks.named('jar') { from('LICENSE') { into 'META-INF/licenses' } }

sourceSets.main.java {
    exclude 'com/buuz135/industrial/plugin/emi/**'
    exclude 'com/buuz135/industrial/utils/data/**'
    exclude 'com/buuz135/industrial/recipe/provider/**'
}
tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US', '-Dfile.encoding=UTF-8']
}
